name: e2e

on:
  push:
  pull_request:

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Ensure UTF-8 locale (Linux)
        if: runner.os == 'Linux'
        run: sudo locale-gen en_US.UTF-8
      - name: Syntax
        run: |
          for f in pipeline/run.sh pipeline/checks.sh pipeline/duty.sh install.sh tests/e2e.sh tests/fakes/codex tests/fakes/claude; do bash -n "$f"; done
          python3 -m py_compile pipeline/state.py pipeline/notify.py pipeline/tally.py pipeline/run_sh_check.py pipeline/hooks/bigread_guard.py tests/fakes/smoke.py
      - name: run.sh check (bash -n, shellcheck, unassigned variables)
        if: runner.os == 'Linux'
        run: python3 pipeline/run_sh_check.py
      - name: End-to-end with fake models
        run: bash tests/e2e.sh
